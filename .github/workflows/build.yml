name: Build and Release

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Windows ビルド (x64 / ARM64)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and Archive Windows
        shell: pwsh
        run: |
          $AppName = "OtoBatchEditor"
          $PublishDir = "OtoBatchEditor\bin\Release"
          $RIDs = @("win-x64", "win-arm64")

          # .csproj からバージョン情報を取得
          $CsprojPath = "$AppName\$AppName.csproj"
          [xml]$csprojXml = Get-Content $CsprojPath
          $versionRaw = $csprojXml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($versionRaw)) { $versionRaw = "2.0.0" }
          $versionTag = "v" + ($versionRaw -replace '\.', ''-replace '-', '')
          Write-Host "Detected Version: $versionRaw -> Tag: $versionTag"

          foreach ($rid in $RIDs) {
              Write-Host "Publishing $rid..."
              $outputDir = "$PublishDir\$rid"
              dotnet publish "$CsprojPath" -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o $outputDir

              $zipFileName = "$AppName-$versionTag-$rid.zip"
              $zipPath = "$PublishDir\$zipFileName"
              if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

              Compress-Archive -Path "$outputDir\*" -DestinationPath $zipPath -Force
              Write-Host "Zip created: $zipPath"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: OtoBatchEditor/bin/Release/*.zip

  # ==========================================
  # 2. macOS ユニバーサルビルド (x64 + ARM64)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and Universal Bundle macOS
        shell: pwsh
        run: |
          $AppName = "OtoBatchEditor"
          $PublishDir = "OtoBatchEditor/bin/Release"

          # .csproj からバージョン情報を取得
          $CsprojPath = "$AppName/$AppName.csproj"
          [xml]$csprojXml = Get-Content $CsprojPath
          $versionRaw = $csprojXml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($versionRaw)) { $versionRaw = "2.0.0" }
          $versionTag = "v" + ($versionRaw -replace '\.', ''-replace '-', '')
          Write-Host "Detected Version: $versionRaw -> Tag: $versionTag"

          # 個別アーキテクチャのビルド
          foreach ($macRid in @("osx-x64", "osx-arm64")) {
              Write-Host "Publishing $macRid..."
              $outputDir = "$PublishDir/$macRid"
              dotnet publish "$CsprojPath" -c Release -r $macRid --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o $outputDir
          }

          # .app バンドルの作成と Universal 化 (lipo)
          Write-Host "Creating macOS Universal .app bundle..."
          $AppBundleDir = "$PublishDir/osx-universal/$AppName.app/Contents"
          New-Item -ItemType Directory -Force -Path "$AppBundleDir/MacOS" | Out-Null
          New-Item -ItemType Directory -Force -Path "$AppBundleDir/Resources" | Out-Null

          # アセットやマネージドファイルをコピー (arm64版をベース)
          Copy-Item "$PublishDir/osx-arm64/*" "$AppBundleDir/MacOS" -Recurse -Force

          # lipoコマンドで実行ファイルを統合
          lipo -create -output "$AppBundleDir/MacOS/$AppName" `
               "$PublishDir/osx-x64/$AppName" `
               "$PublishDir/osx-arm64/$AppName"

          # Info.plist と アイコンの配置
          $InfoPlistPath = "$AppName/Info.plist"
          if (Test-Path $InfoPlistPath) { Copy-Item $InfoPlistPath $AppBundleDir -Force }
          $IcnsPath = "$AppName/Assets/MaikoTools.icns"
          if (Test-Path $IcnsPath) { Copy-Item $IcnsPath "$AppBundleDir/Resources" -Force }

          # Universal 版の Zip アーカイブを作成
          $zipFileName = "$AppName-$versionTag-osx-universal.zip"
          $zipPath = "$PublishDir/$zipFileName"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          $targetPath = "$PublishDir/osx-universal/$AppName.app"
          Compress-Archive -Path $targetPath -DestinationPath $zipPath -Force
          Write-Host "Universal Zip created: $zipPath"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-build
          path: OtoBatchEditor/bin/Release/*-osx-universal.zip

  # ==========================================
  # 3. GitHub Releases への自動公開
  # ==========================================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-universal-build
          path: dist

      - name: Create Git Tag and Release
        id: create_release
        shell: bash
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" OtoBatchEditor/OtoBatchEditor.csproj)
          echo "Detected Version: $VERSION"

          # プレリリースの判定 (ハイフンやアルファベットが含まれている場合はプレリリースにする)
          if [[ "$VERSION" =~ [-] ]] || [[ "$VERSION" =~ [a-zA-Z] ]]; then
            echo "Pre-release version detected."
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Stable version detected."
            echo "prerelease=false" >> $GITHUB_OUTPUT
          }

          TAG="v$VERSION"
          echo "Generated Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_release.outputs.tag }}
          name: Release ${{ steps.create_release.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.create_release.outputs.prerelease }} # 💡 自動判定した結果を適用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}